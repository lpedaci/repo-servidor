name: Chequeo mensual de links

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar links con lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --max-retries 2
            --accept 200..=299,403,429
            --exclude-loopback
            --exclude-path src/content/posts/_plantilla.md
            'src/data/cursos.json'
            'src/data/recursos.json'
            'src/content/posts/*.md'
          output: ./lychee/out.md
          fail: false
      - name: Abrir issue si hay links caídos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Links caídos en el server (chequeo mensual)
          content-filepath: ./lychee/out.md
          labels: links, mantenimiento
